{% extends "base.html" %}

{% block title %}Deal Room Pipeline | Interlink Foundry{% endblock %}

{% block css %}
<style>
.deal-room-wrapper { height: calc(100vh - 180px); min-height: 550px; max-height: 750px; }
.thread-sidebar { background:#f8f9fa; border-right:1px solid #e3e6f0; }
.thread-scroll-area { overflow-y:auto; height:calc(100% - 60px); }
.message-stream-log { overflow-y:auto; height:calc(100% - 140px); padding:1.5rem; background:#fafbfe; }
</style>
{% endblock %}

{% block content %}

<div class="container-fluid px-4 py-3">

<div class="card deal-room-wrapper border-0 shadow-sm overflow-hidden">
<div class="row g-0 h-100">

<!-- LEFT -->
<div class="col-lg-4 thread-sidebar d-flex flex-column">
    <div class="p-3 border-bottom bg-white fw-bold small text-uppercase">
        Active Conversations
    </div>

    <div id="channels-target" class="thread-scroll-area p-2">
        Loading...
    </div>
</div>

<!-- RIGHT -->
<div class="col-lg-8 d-flex flex-column">

    <div class="p-3 border-bottom bg-white" id="active-room-header">
        Select a conversation
    </div>

    <div id="message-stream-target" class="message-stream-log d-flex flex-column gap-2">
        Empty
    </div>

    <div class="p-3 border-top bg-light">
        <form id="chat-form" class="d-flex gap-2">
            <input id="message-input" class="form-control" disabled placeholder="Type message...">
            <button id="send-btn" class="btn btn-primary" disabled>Send</button>
        </form>
    </div>

</div>

</div>
</div>

</div>

{% endblock %}

{% block javascript %}

<script type="module">
import { StreamChat } from "https://cdn.jsdelivr.net/npm/stream-chat@11.0.1/+esm";

let client = null;
let activeChannel = null;

const el = (id) => document.getElementById(id);

function renderMessages(messages) {
    const box = el("message-stream-target");
    box.innerHTML = "";

    messages.forEach(m => {
        const div = document.createElement("div");
        div.className = (m.user?.id === client.userID)
            ? "text-end"
            : "text-start";

        div.innerHTML = `
            <div class="d-inline-block p-2 rounded ${
                m.user?.id === client.userID ? 'bg-primary text-white' : 'bg-light'
            }">
                ${m.text || ''}
            </div>
        `;
        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}

async function init() {

    const res = await fetch("{% url 'accounts:stream_token' %}");
    const data = await res.json();

    client = StreamChat.getInstance(data.api_key);

    await client.connectUser(
        { id: String(data.user_id), name: data.username },
        data.token
    );

    const channels = await client.queryChannels(
        { members: { $in: [String(data.user_id)] } },
        { last_message_at: -1 },
        { watch: true, state: true }
    );

    const sidebar = el("channels-target");
    sidebar.innerHTML = "";

    channels.forEach(ch => {

        const other = Object.values(ch.state.members || {})
            .find(m => m.user?.id !== client.userID);

        const name = other?.user?.name || "Chat";

        const div = document.createElement("div");
        div.className = "p-2 mb-2 bg-white border rounded";
        div.style.cursor = "pointer";

        div.innerText = name;

        div.onclick = async () => {
            activeChannel = ch;

            el("active-room-header").innerText = name;

            const messages = ch.state.messages || [];
            renderMessages(messages);

            el("message-input").disabled = false;
            el("send-btn").disabled = false;

            ch.on("message.new", () => {
                renderMessages(ch.state.messages);
            });
        };

        sidebar.appendChild(div);
    });
}

el("chat-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!activeChannel) return;

    const input = el("message-input");
    const text = input.value.trim();
    if (!text) return;

    await activeChannel.sendMessage({ text });

    input.value = "";
});

window.addEventListener("load", init);

</script>

{% endblock %}
