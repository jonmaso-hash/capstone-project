{% extends "base.html" %}
{% load static %}

{% block title %}Deal Room | Interlink Foundry{% endblock %}

{% block css %}
<style>
.deal-room-wrapper { 
    height: calc(100vh - 180px); 
    min-height: 550px; 
    max-height: 750px; 
}
.thread-sidebar { 
    background: #f8f9fa; 
    border-right: 1px solid #e3e6f0; 
}
.thread-scroll-area { 
    overflow-y: auto; 
    height: calc(100% - 60px); 
}
.message-stream-log { 
    overflow-y: auto; 
    height: calc(100% - 140px); 
    padding: 1.5rem; 
    background: #fafbfe; 
}
.channel-row { 
    cursor: pointer; 
}
.channel-row:hover { 
    background-color: #f1f3f5; 
}
.channel-row.active-thread-card { 
    background: #fff; 
    border-left: 4px solid #0d6efd; 
}
.unread-count-badge { 
    font-size: 0.7rem; 
}
</style>
{% endblock css %}

{% block content %}
<div class="container-fluid px-4 py-3">
    <div class="card shadow-sm border-0 deal-room-wrapper">
        <div class="row g-0 h-100">
            <div class="col-md-4 thread-sidebar d-flex flex-column">
                <div class="p-3 border-bottom bg-white fw-bold small">Active Conversations</div>
                <div id="channels-target" class="thread-scroll-area p-2">
                    <div class="text-center text-muted py-5">
                        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                        Loading connections...
                    </div>
                </div>
            </div>

            <div class="col-md-8 d-flex flex-column">
                <div id="active-room-header" class="p-3 border-bottom bg-white fw-bold">Select a Conversation</div>
                
                <div id="message-stream-target" class="message-stream-log flex-grow-1"></div>

                <form id="chat-form" class="p-3 border-top bg-light d-flex gap-2">
                    <input id="message-input" class="form-control" disabled placeholder="Type a message...">
                    <button id="send-btn" type="submit" class="btn btn-primary" disabled>Send</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
const el = (id) => document.getElementById(id);

function escapeHtml(text = "") {
    return String(text).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

function formatTime(dateString) {
    if (!dateString) return "";
    const date = new Date(dateString);
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// Icon/label per content_type — shared_by is deliberately NOT a custom
// field on the message; Stream's own m.user is already "who sent this,"
// so it'd just be a second, driftable source of the same fact.
const SHARE_CARD_META = {
    PROFILE: { icon: 'bi-person-fill', verb: 'shared a profile with you' },
    VIDEO_FOUNDER: { icon: 'bi-camera-reels-fill', verb: 'shared a video with you' },
    VIDEO_SELLER: { icon: 'bi-camera-reels-fill', verb: 'shared a video with you' },
    BLOG: { icon: 'bi-file-text-fill', verb: 'shared an article with you' },
    JOB: { icon: 'bi-briefcase-fill', verb: 'shared a job with you' },
};

// The Stream message only ever carries content_type/content_id — never
// trusted as proof the viewer can currently see the content. Every
// render re-resolves against the CURRENT viewer's permissions via
// /sharing/resolve/, so a permission revoked (or content deleted) after
// the share was sent shows as unavailable immediately, not the stale
// state from when it was sent.
async function resolveShareCard(contentType, contentId, elementId, senderName) {
    const target = document.getElementById(elementId);
    if (!target) return;
    const meta = SHARE_CARD_META[contentType] || { icon: 'bi-link-45deg', verb: 'shared this with you' };

    try {
        const res = await fetch(`/sharing/resolve/?content_type=${encodeURIComponent(contentType)}&content_id=${encodeURIComponent(contentId)}`, {
            credentials: 'same-origin',
        });
        const data = await res.json();

        if (!data.available) {
            target.innerHTML = `<div class="small fst-italic opacity-75"><i class="bi bi-exclamation-circle me-1"></i>This content is no longer available.</div>`;
            return;
        }

        target.innerHTML = `
            <div class="small mb-2">${escapeHtml(senderName)} ${meta.verb}</div>
            <div class="d-flex align-items-center gap-2 p-2 rounded-3 text-dark" style="background: rgba(255,255,255,0.85);">
                <i class="bi ${meta.icon} fs-4"></i>
                <div class="flex-grow-1 text-start">
                    <div class="fw-semibold small">${escapeHtml(data.title)}</div>
                    ${data.subtitle ? `<div class="text-muted" style="font-size: 0.75rem;">${escapeHtml(data.subtitle)}</div>` : ''}
                </div>
            </div>
            <a href="${data.view_url}" class="btn btn-sm btn-outline-dark w-100 mt-2 bg-white">View</a>
        `;
    } catch (err) {
        target.innerHTML = `<div class="small text-danger">Could not load shared content.</div>`;
    }
}

function renderMessages(messages = []) {
    const box = el("message-stream-target");
    if (!box || !StreamChatController.client) return;

    box.innerHTML = "";
    messages.forEach((m, idx) => {
        const mine = m.user?.id === StreamChatController.client.userID;
        const div = document.createElement("div");
        div.className = `mb-3 ${mine ? "text-end" : "text-start"}`;
        const senderLabel = `
            <div class="text-muted mt-1 d-flex ${mine ? 'justify-content-end' : 'justify-content-start'}" style="font-size: 0.7rem; gap: 6px;">
                <span class="fw-semibold">${escapeHtml(m.user?.name || m.user?.id || "")}</span>
                <span>•</span>
                <span>${formatTime(m.created_at)}</span>
            </div>`;

        if (m.content_type && m.content_id) {
            const cardId = `share-card-${idx}`;
            div.innerHTML = `
                <div class="d-inline-block p-2 rounded shadow-sm ${mine ? "bg-primary text-white" : "bg-white text-dark border"}" style="max-width:75%; min-width: 240px;">
                    ${m.text ? `<div class="small mb-2">${escapeHtml(m.text)}</div>` : ''}
                    <div id="${cardId}"><div class="small"><span class="spinner-border spinner-border-sm me-1"></span>Loading shared content…</div></div>
                </div>
                ${senderLabel}
            `;
            box.appendChild(div);
            resolveShareCard(m.content_type, m.content_id, cardId, m.user?.name || m.user?.id || 'Someone');
        } else {
            div.innerHTML = `
                <div class="d-inline-block p-2 rounded shadow-sm ${mine ? "bg-primary text-white" : "bg-white text-dark border"}" style="max-width:75%">
                    ${escapeHtml(m.text || "")}
                </div>
                ${senderLabel}
            `;
            box.appendChild(div);
        }
    });
    box.scrollTop = box.scrollHeight;
}

document.addEventListener("DOMContentLoaded", async () => {
    const sidebar = el("channels-target");
    const chatForm = el("chat-form");
    const messageInput = el("message-input");
    
    try {
        const client = await StreamChatController.connect();
        const urlParams = new URLSearchParams(window.location.search);
        const targetCid = urlParams.get('cid');

        const channels = await client.queryChannels({ members: { $in: [client.userID] } }, { last_message_at: -1 }, { watch: true, state: true });

        if (!sidebar) return;
        sidebar.innerHTML = channels.length ? "" : '<div class="p-3 text-muted">No conversations.</div>';

        let autoSelect = null;
        channels.forEach(ch => {
            const item = document.createElement("div");
            item.className = "p-2 mb-2 border rounded channel-row";
            item.setAttribute("data-cid", ch.cid);
            item.innerHTML = `<div class="fw-medium">${ch.data.name || 'Chat'}</div>`;
            
            item.onclick = async () => {
                StreamChatController.activeChannel = ch;
                el("active-room-header").textContent = ch.data.name || "Deal Room";
                
                document.querySelectorAll(".channel-row").forEach(r => r.classList.remove("active-thread-card"));
                item.classList.add("active-thread-card");

                await ch.watch();
                renderMessages(ch.state.messages);
                
                messageInput.disabled = false;
                el("send-btn").disabled = false;
                messageInput.focus();

                ch.on('message.new', event => {
                    renderMessages(ch.state.messages);
                });
            };
            sidebar.appendChild(item);
            
            if (targetCid === ch.cid || (!targetCid && autoSelect === null)) {
                autoSelect = item;
            }
        });

        if (autoSelect) autoSelect.click();

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !StreamChatController.activeChannel) return;
            
            messageInput.value = "";
            await StreamChatController.activeChannel.sendMessage({ text: text });
        });

    } catch (err) {
        console.error("Initialization failed:", err);
        sidebar.innerHTML = `<div class="text-danger p-3">Connection failed. Refresh page.</div>`;
    }
});
</script>
{% endblock content %}
