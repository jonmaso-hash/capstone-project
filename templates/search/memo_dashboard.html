{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="mb-4">
                <h1 class="display-5 fw-bold" id="startup-title">Loading Intelligence...</h1>
                <p class="text-muted" id="synthesis-text">Analyzing startup data, please wait...</p>
            </div>

            <div class="card shadow-sm border-0 p-4 mb-4">
                <div class="row">
                    <div class="col-md-6"><canvas id="barChart"></canvas></div>
                    <div class="col-md-6"><canvas id="pieChart"></canvas></div>
                </div>
            </div>
            
            <div class="card shadow-sm border-0 p-4">
                <canvas id="scatterChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const startupName = "{{ startup_name }}"; 
    const token = localStorage.getItem('auth_token'); 

    // Function to fetch data with polling logic
    async function loadMemoIntelligence() {
        try {
            const response = await fetch(`/api/v1/zelda/memo/${startupName}/`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Token ' + token 
                }
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            
            const data = await response.json();

            // Check if the task is still processing
            if (data.status === 'processing') {
                console.log("Task is processing, retrying in 3 seconds...");
                setTimeout(loadMemoIntelligence, 3000); // Poll again
            } else {
                // Task is complete, render the data
                document.getElementById('startup-title').innerText = data.startup;
                document.getElementById('synthesis-text').innerText = data.text_synthesis || "Analysis complete.";
                
                // Initialize your charts here using the received data
                renderCharts(data); 
            }
        } catch (err) {
            console.error("Memo Load Error:", err);
            document.getElementById('startup-title').innerText = "Failed to load intelligence.";
        }
    }

    function renderCharts(data) {
        // Place your existing Chart.js initialization logic here
        console.log("Rendering charts with:", data);
    }

    // Initialize the flow
    loadMemoIntelligence();
</script>
{% endblock %}
