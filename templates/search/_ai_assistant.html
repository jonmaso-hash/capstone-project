<!-- Zelda UI Identity Micro-Animations -->
<style>
    @keyframes subtlePulse {
        0% { transform: scale(0.96); opacity: 0.15; }
        50% { transform: scale(1.04); opacity: 0.35; }
        100% { transform: scale(0.96); opacity: 0.15; }
    }
    .dynamic-pulse {
        animation: subtlePulse 4s infinite ease-in-out;
    }
    .dynamic-glow {
        filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.6));
    }
    .pivot-avatar {
        transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .pivot-avatar:hover {
        transform: scale(1.04) rotate(2deg);
        border-color: #ffffff !important;
    }
</style>

<!-- Floating Action Button (FAB) -->
<button id="ai-agent-toggle" class="btn btn-primary rounded-circle position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center shadow-lg" style="width: 60px; height: 60px; z-index: 1050; background: linear-gradient(135deg, #1e1b4b, #312e81); border: 2px solid #fbbf24;">
    <i class="fa-solid fa-wand-magic-sparkles fs-4" style="color: #fbbf24;"></i>
</button>

<!-- Offcanvas Sidebar Panel -->
<div class="offcanvas offcanvas-end shadow-lg border-0" tabindex="-1" id="aiAgentSidebar" aria-labelledby="aiAgentSidebarLabel" style="width: 400px; border-top-left-radius: 16px; border-bottom-left-radius: 16px;">
    
    <!-- Zelda Visual Persona Header Layout -->
    <div class="offcanvas-header text-white p-4 flex-column align-items-start position-relative" style="background: linear-gradient(135deg, #0f172a, #1e1b4b); border-left: 4px solid #fbbf24; overflow: hidden;">
        
        <!-- Ambient Background Vector Graphic Grid -->
        <div class="position-absolute end-0 top-0 opacity-10 pointer-events-none mt-n2 me-n2" style="font-size: 140px; color: #fbbf24; transform: rotate(15deg);">
            <i class="fa-solid fa-shapes"></i>
        </div>

        <!-- Upper Action Control Context -->
        <div class="d-flex w-100 justify-content-between align-items-center mb-3 position-relative" style="z-index: 2;">
            <span class="badge text-dark fw-bold px-2.5 py-1" style="background-color: #fbbf24; font-size: 10px; letter-spacing: 1px;">AI CORE ACTIVE</span>
            <button type="button" class="btn-close btn-close-white m-0" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <!-- Identity Frame Stack -->
        <div class="d-flex align-items-center gap-3 w-100 position-relative" style="z-index: 2;">
            
            <!-- Zelda Visual Avatar Core Component -->
            <div class="position-relative d-flex align-items-center justify-content-center rounded-3 shadow-inner pivot-avatar" style="width: 60px; height: 60px; border: 2px solid #fbbf24; background: radial-gradient(circle, #1e1b4b 0%, #020617 100%);">
                <div class="position-absolute translate-middle top-50 start-50 text-center w-100 h-100 d-flex align-items-center justify-content-center">
                    <i class="fa-solid fa-shield-halved position-absolute fs-3 opacity-20 dynamic-pulse" style="color: #fbbf24; animation-duration: 3s;"></i>
                    <i id="zelda-face-icon" class="fa-solid fa-wand-magic-sparkles fs-4 dynamic-glow" style="color: #fbbf24; transition: all 0.3s ease;"></i>
                </div>
                <!-- Status Processing Dot -->
                <span id="zelda-status-dot" class="position-absolute bottom-0 end-0 p-1 bg-success border border-2 border-dark rounded-circle m-1"></span>
            </div>

            <!-- Descriptive Typography -->
            <div>
                <h4 class="offcanvas-title fw-bold text-white mb-0 tracking-tight" id="aiAgentSidebarLabel">Zelda</h4>
                <p class="mb-0" style="font-size: 12px; color: rgba(251, 191, 36, 0.85); font-weight: 500; letter-spacing: 0.5px;">
                    <i class="fa-solid fa-network-wired me-1" style="font-size: 10px;"></i> Platform Intelligence Guide
                </p>
            </div>
        </div>
    </div>

    <!-- Body Layout -->
    <div class="offcanvas-body d-flex flex-column p-4">
        <!-- Search Execution Box -->
        <form id="global-agent-form" autocomplete="off" class="mb-3">
            <div class="input-group border rounded-3 p-1 bg-light">
                <span class="input-group-text bg-transparent border-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="globalAgentQuery" class="form-control bg-transparent border-0 shadow-none" placeholder="Ask Zelda to find matches, stacks, or data...">
                <button type="submit" class="btn btn-dark btn-sm rounded-2 px-3">Seek</button>
            </div>
        </form>

        <!-- Quick Shortcuts -->
        <div class="mb-4">
            <div class="d-flex flex-wrap gap-1">
                <span class="badge bg-secondary-subtle text-secondary p-2 rounded-pill small-badge" style="cursor: pointer;" onclick="runQuickSearch('Python')">#Python</span>
                <span class="badge bg-secondary-subtle text-secondary p-2 rounded-pill small-badge" style="cursor: pointer;" onclick="runQuickSearch('SaaS')">#SaaS</span>
                <span class="badge bg-secondary-subtle text-secondary p-2 rounded-pill small-badge" style="cursor: pointer;" onclick="runQuickSearch('Fintech')">#Fintech</span>
            </div>
        </div>

        <hr class="text-muted opacity-25 mt-0">

        <!-- Async Dynamic Response Container -->
        <div class="flex-grow-1 overflow-y-auto" id="global-agent-viewport">
            <div class="text-center text-muted py-5" id="agent-empty-state">
                <i class="fa-regular fa-compass fs-1 mb-3 opacity-25"></i>
                <p class="small mb-0">"What links are we looking for today?"</p>
                <small class="text-muted opacity-75 d-block mt-1" style="font-size: 11px;">Ask me to scan profiles, mandates, or postings across Interlink.</small>
            </div>

            <!-- Thinking Indicator -->
            <div id="global-agent-thinking" class="text-center py-4 d-none">
                <div class="spinner-border spinner-border-sm" style="color: #312e81;" role="status"></div>
                <small class="text-muted ms-2 d-block mt-2">Zelda is navigating data clusters...</small>
            </div>

            <!-- Result Injection Node -->
            <div id="global-results-output" class="d-none"></div>
        </div>
    </div>
</div>

<!-- Script Controller Architecture -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sidebarEl = document.getElementById('aiAgentSidebar');
        const sidebar = new bootstrap.Offcanvas(sidebarEl);
        
        // Bind floating trigger button
        document.getElementById('ai-agent-toggle').addEventListener('click', () => sidebar.show());

        const form = document.getElementById('global-agent-form');
        const input = document.getElementById('globalAgentQuery');
        const emptyState = document.getElementById('agent-empty-state');
        const thinking = document.getElementById('global-agent-thinking');
        const output = document.getElementById('global-results-output');
        
        // Face Node Element Targets
        const faceIcon = document.getElementById('zelda-face-icon');
        const statusDot = document.getElementById('zelda-status-dot');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) executeGlobalQuery(input.value.trim());
        });

        window.runQuickSearch = function(keyword) {
            input.value = keyword;
            executeGlobalQuery(keyword);
        };

        function executeGlobalQuery(query) {
            emptyState.classList.add('d-none');
            output.classList.add('d-none');
            thinking.classList.remove('d-none');
            output.innerHTML = '';

            // Transition Zelda to Active Processing State
            faceIcon.className = "fa-solid fa-compass-drafting fs-4 fa-spin";
            faceIcon.style.color = "#ffffff";
            statusDot.className = "position-absolute bottom-0 end-0 p-1 bg-warning border border-2 border-dark rounded-circle m-1";

            // Asynchronous query dispatching against API routes
            // Use POST and send JSON payload
fetch('/accounts/search-api/', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
    },
    body: JSON.stringify({ q: query })
})
.then(res => res.json())
.then(data => {
    thinking.classList.add('d-none');
    output.classList.remove('d-none');

    // UI Reset
    faceIcon.className = "fa-solid fa-wand-magic-sparkles fs-4 dynamic-glow";
    faceIcon.style.color = "#fbbf24";
    statusDot.className = "position-absolute bottom-0 end-0 p-1 bg-success border border-2 border-dark rounded-circle m-1";

    // Ensure results key exists (matches views.py response)
    const items = data.results || [];
    
    if (items.length === 0) {
        output.innerHTML = `<div class="text-center text-muted py-4 small">No matches found.</div>`;
        return;
    }

    items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'p-3 mb-2 border rounded-3 bg-white shadow-sm transition';
        row.innerHTML = `
            <h6 class="fw-bold text-dark mb-1 small">${item.title}</h6>
            <p class="text-muted mb-2" style="font-size: 12px; line-height: 1.4;">${item.description}</p>
            <a href="${item.url}" class="btn btn-sm btn-light border w-100 fw-medium" style="font-size: 11px;">Inspect Asset</a>
        `;
        output.appendChild(row);
    });
})
.catch(err => {
    console.error(err);
    thinking.classList.add('d-none');
    output.classList.remove('d-none');
    output.innerHTML = `<div class="text-center text-danger py-4 small">Handshake execution dropped.</div>`;
    
    faceIcon.className = "fa-solid fa-wand-magic-sparkles fs-4 dynamic-glow";
    faceIcon.style.color = "#fbbf24";
    statusDot.className = "position-absolute bottom-0 end-0 p-1 bg-danger border border-2 border-dark rounded-circle m-1";
});

        }
    });
</script>
