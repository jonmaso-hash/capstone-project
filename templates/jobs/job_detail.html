{% extends 'base.html' %} 

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-body">
            <!-- Replace title/description with your actual Job model field names -->
            <h1 class="card-title">{{ job.title }}</h1>
            <p class="text-muted">Posted on: {{ job.created_at|date:"F j, Y" }}</p>
            <hr>
            <p class="card-text">{{ job.description }}</p>
            
            <a href="{% url 'jobs:index' %}" class="btn btn-secondary mt-3">Back to Jobs</a>
        </div>
    </div>
</div>
{% endblock %}
