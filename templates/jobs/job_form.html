{% extends 'base.html' %} 
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4">
    <h2>Create a New Job</h2>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary mt-3">Save Job</button>
    </form>
</div>
{% endblock %}
