name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI-only dummy values — never real secrets. SQLite is used (no DATABASE_URL)
  # since nothing here needs a live database connection.
  SECRET_KEY: ci-only-placeholder-key-not-for-production-use
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  # DEFAULT_FROM_EMAIL derives from EMAIL_HOST_USER; a couple of tests assert an
  # admin FYI email actually reaches the outbox, which silently no-ops when the
  # sender address is empty (EmailMessage drops blank recipients). Tests use the
  # locmem backend regardless, so nothing is sent off-box.
  EMAIL_HOST_USER: ci@example.invalid
  # Run Celery tasks in-process during tests: no broker, no worker, and no
  # dependency on Celery's redis transport (whose `.delay()` calls made from a
  # live view hang under this Python/Celery combination — see
  # zelda_api/tests.py). memory:// keeps anything that inspects the broker/
  # backend URL happy without a running Redis. EAGER_PROPAGATES is left at its
  # default (False) so an in-process task that raises is treated as a failed
  # async result rather than bubbling a new exception into the caller — this
  # keeps test outcomes matching the pre-change "queued, never run" behaviour.
  CELERY_TASK_ALWAYS_EAGER: "True"
  CELERY_BROKER_URL: "memory://"
  CELERY_RESULT_BACKEND: "cache+memory://"

jobs:
  # ── Blocking: fast, hermetic suites. Every local app EXCEPT zelda_api.
  # Keep the app list in sync with INSTALLED_APPS; zelda_api is covered by the
  # non-blocking job below until its test suite is made hermetic.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite (excludes zelda_api)
        run: >-
          python manage.py test --verbosity=2
          accounts blog billing growth jobs matchmaking
          notifications ops pages usersettings

  # ── Non-blocking: the zelda_api suite currently makes live huggingface.co
  # calls, hits the Celery hang, and has known failures (all introduced in the
  # two "IC memo needs works" commits, +4,250 lines in zelda_api/tests.py).
  # Runs on push to main only (not on every PR iteration) for visibility;
  # does not gate merges until it's rehabbed.
  zelda-api-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run zelda_api test suite (non-blocking)
        run: python manage.py test zelda_api --verbosity=2
