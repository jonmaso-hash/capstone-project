name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI-only dummy values — never real secrets. SQLite is used (no DATABASE_URL)
  # since nothing here needs a live database connection.
  SECRET_KEY: ci-only-placeholder-key-not-for-production-use
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  # DEFAULT_FROM_EMAIL derives from EMAIL_HOST_USER; a couple of tests assert an
  # admin FYI email actually reaches the outbox, which silently no-ops when the
  # sender address is empty (EmailMessage drops blank recipients). Tests use the
  # locmem backend regardless, so nothing is sent off-box.
  EMAIL_HOST_USER: ci@example.invalid
  # Run Celery tasks in-process during tests: no broker, no worker, and no
  # dependency on Celery's redis transport (whose `.delay()` calls made from a
  # live view hang under this Python/Celery combination — see
  # zelda_api/tests.py). memory:// keeps anything that inspects the broker/
  # backend URL happy without a running Redis. EAGER_PROPAGATES is left at its
  # default (False) so an in-process task that raises is treated as a failed
  # async result rather than bubbling a new exception into the caller — this
  # keeps test outcomes matching the pre-change "queued, never run" behaviour.
  CELERY_TASK_ALWAYS_EAGER: "True"
  CELERY_BROKER_URL: "memory://"
  CELERY_RESULT_BACKEND: "cache+memory://"

jobs:
  # ── Blocking: fast, hermetic suites. Every local app EXCEPT zelda_api.
  # Keep the app list in sync with INSTALLED_APPS; zelda_api is covered by the
  # non-blocking job below until its test suite is made hermetic.
  check:
    runs-on: ubuntu-latest
    env:
      # One cache location for the producer and the consumer. The
      # default happens to coincide today; that is not a contract.
      HF_HOME: ${{ github.workspace }}/.hf-cache
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The test runner forces HF_HUB_OFFLINE, so the weights must already
      # be on disk. Before this, CI downloaded them live on every run --
      # EmbeddingSemanticOrderingTests deliberately uses a real model, and
      # was quietly depending on huggingface.co being up. One declared
      # fetch, cached between runs, and the test run itself reaches nothing.
      # The model identity comes from the app, never from a literal here.
      # CI pinning a SHA while the loader asked for `main` is what broke the
      # build: a SHA fetch writes no refs/main, so an offline `main` lookup
      # finds nothing. One source of truth removes the disagreement.
      - name: Resolve the embedding model identity
        run: >-
          python -c "from matchmaking.services.ai_utils import
          EMBEDDING_MODEL, EMBEDDING_REVISION;
          print(f'EMBEDDING_MODEL={EMBEDDING_MODEL}');
          print(f'EMBEDDING_REVISION={EMBEDDING_REVISION}')"
          >> "$GITHUB_ENV"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ env.EMBEDDING_REVISION }}
          restore-keys: hf-${{ env.EMBEDDING_REVISION }}

      - name: Put the embedding model on disk
        run: >-
          python -c "from matchmaking.services.ai_utils import
          EMBEDDING_MODEL, EMBEDDING_REVISION;
          from sentence_transformers import SentenceTransformer;
          SentenceTransformer(EMBEDDING_MODEL, revision=EMBEDDING_REVISION)"

      # Observable evidence for the cache-hit path: a restored cache must
      # contain the snapshot already, so a green second run cannot be
      # explained by a silent re-download.
      - name: Show what the cache restored
        run: >-
          python -c "import os, pathlib;
          root = pathlib.Path(os.environ['HF_HOME']);
          files = list(root.rglob('*')) if root.exists() else [];
          print(f'HF_HOME={root} entries={len(files)}');
          print(*[str(p.relative_to(root)) for p in files
          if p.is_dir() and p.name.startswith('1110') or
          p.name == 'snapshots'], sep='\n')"

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite (excludes zelda_api)
        run: >-
          python manage.py test --verbosity=2
          accounts blog billing growth jobs matchmaking
          notifications ops pages sharing usersettings
          zelda_api.tests_library
          zelda_api.tests_truth_delta_visibility
          zelda_api.tests_claims_analyzed_count
          zelda_api.tests_verify_button
          zelda_api.tests_no_sandbox_scan
          zelda_api.tests_no_investment_advice
          zelda_api.tests_finding_disputes
          zelda_api.tests_verification_grounding
          zelda_api.tests_memo_persistence
          zelda_api.tests_claim_extraction_scoring
          zelda_api.tests_three_state_grounding
          zelda_api.tests_source_unavailable
          zelda_api.tests_claim_field_binding
          zelda_api.tests_source_failure_reaches_the_report
          zelda_api.tests_source_naming
          zelda_api.tests_report_semantics
          zelda_api.tests_source_capabilities
          zelda_api.tests_sec_company_identity
          zelda_api.tests_identity_authority
          zelda_api.tests_observation_registrant
          zelda_api.tests_identity_chain_of_custody
          zelda_api.tests_verification_failure_is_visible
          zelda_api.tests_dashboard_authorization
          zelda_api.tests_terminal_notifications
          zelda_api.tests_valuation_disclosure
          zelda_api.tests_financial_fact_semantics
          zelda_api.tests_companyenrich
          zelda_api.tests_verification_starts_together
          pages.tests_no_network_in_tests
          zelda_api.tests_filed
          zelda_api.tests_jurisdiction
          zelda_api.tests_filed_authority
          zelda_api.tests_filed_outcomes
          zelda_api.tests_registry_source

  # ── Non-blocking: the zelda_api suite currently makes live huggingface.co
  # calls, hits the Celery hang, and has known failures (all introduced in the
  # two "IC memo needs works" commits, +4,250 lines in zelda_api/tests.py).
  # Runs on push to main only (not on every PR iteration) for visibility;
  # does not gate merges until it's rehabbed.
  zelda-api-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # One cache location for the producer and the consumer. The
      # default happens to coincide today; that is not a contract.
      HF_HOME: ${{ github.workspace }}/.hf-cache
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The test runner forces HF_HUB_OFFLINE, so the weights must already
      # be on disk. Before this, CI downloaded them live on every run --
      # EmbeddingSemanticOrderingTests deliberately uses a real model, and
      # was quietly depending on huggingface.co being up. One declared
      # fetch, cached between runs, and the test run itself reaches nothing.
      # The model identity comes from the app, never from a literal here.
      # CI pinning a SHA while the loader asked for `main` is what broke the
      # build: a SHA fetch writes no refs/main, so an offline `main` lookup
      # finds nothing. One source of truth removes the disagreement.
      - name: Resolve the embedding model identity
        run: >-
          python -c "from matchmaking.services.ai_utils import
          EMBEDDING_MODEL, EMBEDDING_REVISION;
          print(f'EMBEDDING_MODEL={EMBEDDING_MODEL}');
          print(f'EMBEDDING_REVISION={EMBEDDING_REVISION}')"
          >> "$GITHUB_ENV"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ env.EMBEDDING_REVISION }}
          restore-keys: hf-${{ env.EMBEDDING_REVISION }}

      - name: Put the embedding model on disk
        run: >-
          python -c "from matchmaking.services.ai_utils import
          EMBEDDING_MODEL, EMBEDDING_REVISION;
          from sentence_transformers import SentenceTransformer;
          SentenceTransformer(EMBEDDING_MODEL, revision=EMBEDDING_REVISION)"

      # Observable evidence for the cache-hit path: a restored cache must
      # contain the snapshot already, so a green second run cannot be
      # explained by a silent re-download.
      - name: Show what the cache restored
        run: >-
          python -c "import os, pathlib;
          root = pathlib.Path(os.environ['HF_HOME']);
          files = list(root.rglob('*')) if root.exists() else [];
          print(f'HF_HOME={root} entries={len(files)}');
          print(*[str(p.relative_to(root)) for p in files
          if p.is_dir() and p.name.startswith('1110') or
          p.name == 'snapshots'], sep='\n')"

      - name: Run zelda_api test suite (non-blocking)
        run: python manage.py test zelda_api --verbosity=2
